<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - G-Scanner</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#BFDEB4">
    <link rel="icon" href="../assets/logo/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="../assets/logo/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">
    
    <!-- Local Fonts Preload (PageSpeed 100) -->
    <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>

    <!-- External CSS -->
    <link rel="preload" as="style" href="style.css">
    <link rel="stylesheet" href="style.css">

    <!-- External JS -->
    <script> 
        // Applica il tema istantaneamente (Nessun lampo bianco)
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Ascolta in tempo reale i cambiamenti del sistema operativo
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            // Cambia in tempo reale SOLO SE l'utente non ha forzato una scelta manuale col bottone
            if (!('theme' in localStorage)) {
                if (e.matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        });
    </script>
</head>
<body class="bg-[#FAF9FC] dark:bg-[#121214] text-[#1B1B1E] dark:text-[#E4E2E6] flex flex-col items-center justify-center min-h-screen text-center px-6">
    
    <span style="--icon: url('assets/icons/search_off.svg')" class="svg-icon text-8xl mb-6 text-[#0D631B] dark:text-[#81D683]" translate="no" aria-hidden="true"></span>
    <h1 class="text-5xl font-bold mb-4">404</h1>
    <h2 class="text-2xl font-semibold mb-6">Page not found</h2>
    <p class="text-lg text-gray-500 dark:text-gray-400 mb-8 max-w-md">
        The page you are looking for doesn't exist or has been moved. 
    </p>
    
    <a href="/" class="bg-[#0D631B] dark:bg-[#81D683] text-white dark:text-[#00390E] px-8 py-4 rounded-full font-semibold text-lg flex items-center gap-2 hover:-translate-y-1 transition-transform">
        <span style="--icon: url('assets/icons/home.svg')" class="svg-icon" translate="no" aria-hidden="true"></span>
        Return to Home
    </a>

</body>
</html>
