<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - G-Scanner</title>
    <meta name="robots" content="noindex"> <!-- Importante: dice a Google di non indicizzare l'errore -->
    <meta name="theme-color" content="#BFDEB4">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,0..1,0,24" rel="stylesheet" />
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#FAF9FC] dark:bg-[#121214] text-[#1B1B1E] dark:text-[#E4E2E6] flex flex-col items-center justify-center min-h-screen text-center px-6">
    
    <span class="material-symbols-outlined text-8xl mb-6 text-[#0D631B] dark:text-[#81D683]" translate="no">search_off</span>
    <h1 class="text-5xl font-bold mb-4">404</h1>
    <h2 class="text-2xl font-semibold mb-6">Page not found</h2>
    <p class="text-lg text-gray-500 dark:text-gray-400 mb-8 max-w-md">
        The page you are looking for doesn't exist or has been moved. 
    </p>
    
    <a href="/" class="bg-[#0D631B] dark:bg-[#81D683] text-white dark:text-[#00390E] px-8 py-4 rounded-full font-semibold text-lg flex items-center gap-2 hover:-translate-y-1 transition-transform">
        <span class="material-symbols-outlined" translate="no">home</span>
        Return to Home
    </a>

</body>
</html>
